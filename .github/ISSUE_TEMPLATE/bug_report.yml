name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential workbooks. Create a minimal sanitized reproduction when possible.
  - type: input
    id: version
    attributes:
      label: xlsx2rocksdb version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and Java version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and options
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Data safety
      options:
        - label: I have removed credentials, personal data, and confidential workbook content.
          required: true
